name: Mobile CI - Test & Build APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build APK Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter Tests
        working-directory: ./mobile
        run: flutter test

      - name: Build Universal Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build-artifacts/DocuMind-main-${{ github.sha }}.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DocuMind-Release-APK
          path: build-artifacts/*.apk
          retention-days: 14
