name: DocuMind CI/CD - Full System Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master
      - 'feature/**'
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documind-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. BACKEND CI (Python / FastAPI / UV)
  # ==========================================
  backend-ci:
    name: Backend API, Contracts & Fresh Migrations
    runs-on: ubuntu-24.04
    env:
      SECRET_KEY: ci-only-0c4edc97d6ef483ca292d019f0da7b65
      TEST_DATABASE_URL: postgresql://postgres:phase1-test@127.0.0.1:5432/documind_phase1_test
      DATABASE_URL_OVERRIDE: postgresql://postgres:phase1-test@127.0.0.1:5432/documind_phase1_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase1-test
          POSTGRES_DB: documind_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d documind_phase1_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"

      - name: Install Backend and Test Dependencies from Lockfile
        run: uv sync --frozen --only-group backend --only-group dev

      - name: Syntax Validation
        run: uv run --no-sync python -m compileall -q backend ai

      - name: Install Matching PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: API, Security, Contracts and Migration Tests
        run: uv run --no-sync pytest

      - name: Check Alembic Metadata
        run: uv run --no-sync alembic check

  # ==========================================
  # 2. WEB CI (Next.js / TypeScript / ESLint)
  # ==========================================
  web-ci:
    name: Web CI (Lint & Production Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Run ESLint
        working-directory: ./web
        run: npm run lint

      - name: Web Contract and Auth Flow Tests
        working-directory: ./web
        run: npm test

      - name: Build Next.js Application
        working-directory: ./web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

  # ==========================================
  # 3. MOBILE CI & RELEASE (Flutter / APK)
  # ==========================================
  mobile-ci:
    name: Mobile CI & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        working-directory: ./mobile
        run: flutter test

      - name: Cache Gradle Wrapper Distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Prepare Gradle with Bounded Retries
        working-directory: ./mobile/android
        timeout-minutes: 10
        shell: bash
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle bootstrap failed; retrying ($attempt/3)."
              sleep $((attempt * 10))
            fi
          done
          echo "Gradle bootstrap failed after 3 attempts."
          exit 1

      - name: Build Test APK (Not a Release)
        working-directory: ./mobile
        run: flutter build apk --debug

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk release-artifacts/DocuMind-Test-${GITHUB_SHA}.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DocuMind-Test-APK
          path: release-artifacts/*.apk
          retention-days: 14

  android-beta:
    name: Signed Android Beta (Main Only)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend-ci, web-ci, mobile-ci]
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Persistent Signing and Validate Cloud URL
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/android_release.py prepare --temporary-dir "$RUNNER_TEMP/android-signing"
      - name: Build Signed Cloud APK
        working-directory: mobile
        run: >-
          flutter build apk --release
          --dart-define="API_BASE_URL=$API_BASE_URL"
          --build-name="$RELEASE_VERSION"
          --build-number="$RELEASE_BUILD_NUMBER"
      - name: Verify Certificate, Package and Checksums
        run: |
          mkdir -p release-artifacts
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/DocuMind-${RELEASE_VERSION}-${RELEASE_BUILD_NUMBER}.apk"
          SDK_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          python scripts/android_release.py verify \
            --apk "release-artifacts/DocuMind-${RELEASE_VERSION}-${RELEASE_BUILD_NUMBER}.apk" \
            --apksigner "$SDK_TOOLS/apksigner" --aapt "$SDK_TOOLS/aapt"
      - uses: actions/upload-artifact@v4
        with:
          name: DocuMind-Beta-APK
          path: release-artifacts/
          retention-days: 30
      - name: Remove Ephemeral Signing Files
        if: always()
        shell: bash
        run: |
          rm -f -- mobile/android/key.properties "$RUNNER_TEMP/android-signing/documind-release.jks"
