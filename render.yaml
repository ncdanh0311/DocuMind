services:
  - type: web
    name: documind-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    autoDeployTrigger: 'off'
    envVars:
      - key: DATABASE_URL_OVERRIDE
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: AI_ENABLED
        value: "false"
      - key: STORAGE_BACKEND
        value: neon_s3
      - key: STORAGE_BUCKET
        value: documind-documents
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_PROVIDER
        value: gmail_api
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
    healthCheckPath: /health
